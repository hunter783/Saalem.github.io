<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saalem.github.io</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #f8fafc;
      }
      .card {
        width: min(90vw, 640px);
        background: rgba(15, 23, 42, 0.45);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 18px;
        padding: 2rem 2.5rem;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome to Saalem.github.io</h1>
      <p>
        This site is now configured for GitHub Pages and is being served from the
        root of the <strong>main</strong> branch.
      </p>
    </main>
  </body>
</html>
